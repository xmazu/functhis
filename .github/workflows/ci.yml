name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and CLI publish smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: functhis
          POSTGRES_PASSWORD: functhis
          POSTGRES_DB: functhis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U functhis" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate env types
        run: bun run env:generate

      - name: Lint and type check
        run: bun run check && bun run check-types

      - name: Test
        run: bun test packages/auth packages/publish packages/cli apps/mcp/src scripts apps/console/src/lib

      - name: Integration test
        env:
          INTEGRATION_DATABASE_URL: postgres://functhis:functhis@127.0.0.1:5432/integration
        run: bun tests/integration/scripts/migrate.ts && bun run --filter @functhis/integration-tests test:integration

      - name: Build CLI
        run: bun run --filter functhis build

      - name: Pack smoke
        run: bun run --filter functhis pack-smoke
