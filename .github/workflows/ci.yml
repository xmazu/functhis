name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and CLI publish smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate env types
        run: bun run env:generate

      - name: Lint and type check
        run: bun run check && bun run check-types

      - name: Test
        run: bun test packages/auth packages/deploy packages/cli apps/mcp/src scripts apps/console/src/lib

      - name: Build CLI
        run: bun run --filter functhis build

      - name: Pack smoke
        run: bun run --filter functhis pack-smoke
